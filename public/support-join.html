<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#07142b" />
  <meta
    name="description"
    content="Create secure access to the RideArrivo Support Command Centre."
  />

  <link
    rel="manifest"
    href="/brand/support/support.webmanifest"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/brand/support/support-favicon-32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/brand/support/support-favicon-16.png"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/brand/support/support-icon-180.png"
  />

  <meta
    property="og:title"
    content="Join RideArrivo Support"
  />
  <meta
    property="og:description"
    content="Create secure access to the RideArrivo Support Command Centre."
  />
  <meta
    property="og:image"
    content="https://support.ridearrivo.com/brand/support/support-og-1200x630.png"
  />
  <meta
    property="og:url"
    content="https://support.ridearrivo.com/support-join"
  />
  <meta property="og:type" content="website" />

  <meta
    name="twitter:card"
    content="summary_large_image"
  />
  <meta
    name="twitter:title"
    content="Join RideArrivo Support"
  />
  <meta
    name="twitter:description"
    content="Create secure access to the RideArrivo Support Command Centre."
  />
  <meta
    name="twitter:image"
    content="https://support.ridearrivo.com/brand/support/support-og-1200x630.png"
  />

  <link rel="stylesheet" href="/support-auth.css" />

  <title>Join RideArrivo Support</title>
</head>

<body class="supportJoinPage">
  <main class="supportJoinShell">
    <section class="supportJoinCard">
      <div class="supportJoinBrand">
        <img
          class="supportJoinBrandIcon"
          src="/brand/support/support-icon-192.png"
          alt=""
        />

        <div class="supportJoinBrandCopy">
          <img
            src="/ridearrivo-wordmark-workspace.png"
            alt="RideArrivo"
          />
          <strong>RideArrivo Support</strong>
          <span>Support Command Centre</span>
        </div>
      </div>

      <h1>Join RideArrivo Support</h1>

      <p>
        Enter the email address your invitation was sent to
        and the one-time code, then choose a secure password.
      </p>

      <form id="joinForm">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        />

        <label for="code">One-time code</label>
        <input
          id="code"
          type="text"
          autocomplete="one-time-code"
          required
        />

        <label for="password">Choose a password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <label for="confirm">Repeat the password</label>
        <input
          id="confirm"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <button id="go" type="submit">
          Create my access
        </button>
      </form>

      <div id="message"></div>

      <div class="supportJoinFooter">
        Secure RideArrivo staff access · Invitation codes are single-use.
      </div>
    </section>
  </main>

<script>
(function () {
  var base = (document.querySelector('meta[name="support-functions-url"]') || {}).content || ''
  var $ = function (id) { return document.getElementById(id) }
  var params = new URLSearchParams(location.search)
  if (params.get('email')) $('email').value = params.get('email')
  if (params.get('code')) $('code').value = params.get('code')
  // Remove the code from the address bar and history as soon as it has been read.
  if (location.search) history.replaceState(null, '', location.pathname)

  function show(text, good) { var m = $('msg'); m.hidden = false; m.className = 'msg ' + (good ? 'good' : 'bad'); m.textContent = text }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault()
    $('msg').hidden = true
    if (!base || base.indexOf('__') === 0) return show('This page is not configured yet. Ask your administrator.')
    var email = $('email').value.trim(), code = $('code').value.trim(), pw = $('pw').value
    if (!email || !code) return show('Enter your email address and the code from your invitation.')
    if (pw.length < 10) return show('Use at least 10 characters for your password.')
    if (pw !== $('pw2').value) return show('The two passwords do not match.')
    $('go').disabled = true; $('go').textContent = 'Working'
    fetch(base.replace(/\/+$/, '') + '/support-invite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'redeem', email: email, code: code, password: pw })
    }).then(function (r) { return r.json().catch(function () { return {} }).then(function (b) { return { ok: r.ok, body: b } }) })
      .then(function (res) {
        if (!res.ok || res.body.error) { show(res.body.error || 'Something went wrong. Try again.'); return }
        $('form-view').hidden = true; $('done-view').hidden = false
        $('done-text').textContent = res.body.existingAccount
          ? 'Support access has been added to your existing account.'
          : 'Welcome' + (res.body.name ? ', ' + res.body.name.split(' ')[0] : '') + '. Your account is ready.'
      })
      .catch(function () { show('Could not reach the server. Check your connection and try again.') })
      .then(function () { $('go').disabled = false; $('go').textContent = 'Create my access' })
  })
  $('signin').addEventListener('click', function () { location.href = '/' })
})()
</script>
</body>
</html>
