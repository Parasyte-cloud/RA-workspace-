<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071A38" />
<title>ROOM 7 is offline</title>
<style>
  body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#071A38;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  main{max-width:360px}
  h1{font-size:24px;margin:0 0 10px}
  p{color:#c7d3e3;line-height:1.55;margin:0 0 22px}
  button{border:0;border-radius:12px;padding:14px 22px;min-height:48px;font:inherit;font-weight:800;background:#ff9900;color:#071a38}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>ROOM 7 needs an internet connection to join a meeting. Check your connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
