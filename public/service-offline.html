<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071A38">
<title>You are offline</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #071a38; color: #f4f7fb; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 32px 24px; text-align: center; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0 auto; max-width: 28rem; color: #b9c6d8; }
  button { justify-self: center; margin-top: 8px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #ff9900; color: #071a38; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="name">You are offline</h1>
  <p>There is no internet connection right now. Your details are safe. Check your connection and try again.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script src="/service-offline.js"></script>
</body>
</html>
