<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light"><title>Offline</title>
<!-- PArAsYtE | RA-Workspace support module -->
<style>:root{--bg:#0b0f17;--text:#e8edf5;--muted:#9aa7bd}@media(prefers-color-scheme:light){:root{--bg:#f4f6fa;--text:#0f1724;--muted:#52607a}}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{flex:1;display:grid;place-items:center;padding:24px 16px;text-align:center}p{color:var(--muted);max-width:360px}
button{padding:12px 20px;border:0;border-radius:11px;background:#d58a2a;color:#111;font:inherit;font-weight:700;cursor:pointer}
footer{padding:18px 16px 22px;text-align:center}footer a{color:#c0c7d1;text-decoration:none;font-weight:800;letter-spacing:.22em;font-size:.82rem;opacity:.85}</style></head>
<body><main><div><h1>You are offline</h1><p>The Support workspace needs a connection. Emergencies and calls cannot reach you until it returns.</p>
<button type="button" onclick="location.reload()">Try again</button></div></main>
<footer><a href="https://www.parasyte.cloud" target="_blank" rel="noopener">PArAsYtE</a></footer></body></html>
