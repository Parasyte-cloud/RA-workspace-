map $http_upgrade $parasyte_connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=parasyte_ws:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=parasyte_api:10m rate=60r/m;

server {
  listen 443 ssl http2;
  server_name linux.ridearrivo.com;

  ssl_certificate /etc/letsencrypt/live/linux.ridearrivo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/linux.ridearrivo.com/privkey.pem;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
  }

  location /api/ {
    limit_req zone=parasyte_api burst=30 nodelay;

    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location = /ide {
    return 302 /ide/;
  }

  # The gateway authenticates the short-lived IDE cookie and then proxies to
  # the engineer's loopback-only code-server port. Nothing under /ide is
  # directly exposed from Docker to the public network.
  location /ide/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $parasyte_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    proxy_buffering off;
  }

  location = /ws {
    limit_req zone=parasyte_ws burst=10 nodelay;

    proxy_pass http://127.0.0.1:8787/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $parasyte_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3700s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }
}
