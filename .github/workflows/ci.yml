name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  # The six Supabase suites cover RLS and security-definer functions. They are
  # left out of `npm test` because they need a local stack, so they get their
  # own job here (sweep RA-001). Migrations are applied from scratch by
  # `supabase start`, which also proves the migration chain replays.
  supabase:
    name: Supabase security suites
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.116.0
      # `supabase start` pulls about a dozen images. When ghcr.io answers
      # "toomanyrequests" the pull fails and the whole job goes red even though
      # nothing in the repo is wrong (it did, for every branch, on 2026-10-22).
      # Layers that already downloaded are kept, so each retry gets further.
      # A real migration error fails every attempt and the job still fails.
      - name: Start local Supabase (applies every migration)
        run: |
          for attempt in 1 2 3 4; do
            if supabase start -x studio,imgproxy,vector,logflare; then
              exit 0
            fi
            echo "supabase start failed (attempt $attempt of 4), retrying after a pause"
            supabase stop --no-backup > /dev/null 2>&1 || true
            sleep $((attempt * 45))
          done
          exit 1
      # The intake Edge Function refuses to run without a rate-limit secret of
      # at least 32 characters, and `supabase start` does not pass one in, so
      # every public submission answered 500. Serve the functions with a
      # throwaway secret (made fresh each run, never stored) and wait until the
      # function answers before the suites start.
      - name: Serve Edge Functions with test secrets
        run: |
          printf 'INTAKE_RATE_LIMIT_SECRET=%s\n' "$(openssl rand -hex 24)" > "$RUNNER_TEMP/functions.env"
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          api=$(supabase status -o env | sed -n 's/^API_URL="\(.*\)"$/\1/p')
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$api/functions/v1/intake?slug=probe" || true)
            if [ "$code" -ge 100 ] && [ "$code" -lt 500 ]; then echo "intake function ready ($code)"; break; fi
            sleep 2
          done
          tail -n 20 "$RUNNER_TEMP/functions.log" || true
      - name: Run the security suites
        run: npm run test:supabase
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  gateway:
    name: Gateway tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
